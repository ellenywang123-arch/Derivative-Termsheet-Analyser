name: Offline checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python cli.py examples/synthetic_termsheet.txt
      - run: python -m py_compile research_pipeline.py run_pipeline.py
