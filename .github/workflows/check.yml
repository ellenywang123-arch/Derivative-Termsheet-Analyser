name: Workflow checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m termsheet_analyser tags examples/synthetic_termsheet.txt
      - run: python -m compileall -q termsheet_analyser cli.py run_pipeline.py
      - run: python -m tools.diagnose_pricing
